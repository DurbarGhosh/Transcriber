<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recording History</title>
  </head>
  <body>
    <h1>Recording History</h1>
    <p><a href="transcription.html">Open transcription queue</a></p>
    <section>
      <h2>Storage</h2>
      <p id="storage-meter">Checking storage…</p>
      <form id="retention-form">
        <label><input id="auto-delete-enabled" type="checkbox"> Automatically delete recordings after</label>
        <input id="auto-delete-days" type="number" min="1" step="1" value="30"> days
        <button type="submit">Save setting</button>
      </form>
      <p>Automatic deletion keeps transcripts.</p>
    </section>
    <form id="search-form">
      <label>Search transcripts <input id="search" type="search"></label>
      <button type="submit">Search</button>
    </form>
    <section id="search-results" hidden>
      <h2>Search results</h2>
      <div id="search-result-list"></div>
    </section>
    <p id="status">Loading recordings…</p>
    <main id="recordings"></main>
    <script type="module" src="/src/pages/history.js"></script>
  </body>
</html>
