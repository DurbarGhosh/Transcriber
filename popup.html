<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Recorder</title>
  </head>
  <body>
    <h1>Tab Recorder</h1>
    <fieldset>
      <legend>Recording mode</legend>
      <label><input name="mode" type="radio" value="audio" checked> Audio only</label>
      <label><input name="mode" type="radio" value="video"> Video + audio</label>
    </fieldset>
    <button id="start" type="button">Start recording this tab</button>
    <button id="stop" type="button" disabled>Stop recording</button>
    <p>Time: <span id="timer">00:00</span></p>
    <p id="status">Ready.</p>
    <button id="open-history" type="button">Open recording history</button>
    <button id="open-spike" type="button">Open transcription test</button>
    <script type="module" src="/src/pages/popup.js"></script>
  </body>
</html>
